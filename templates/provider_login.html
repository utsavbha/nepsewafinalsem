<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NepSewa — Provider Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nepsewa.css">
<link rel="stylesheet" href="/static/login.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-container">
    <a href="/" class="nav-left">
      <img src="/static/final_logo.png" alt="NepSewa Logo" class="logo-img">
    </a>
    
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <ul class="nav-menu" id="navMenu">
      <li><a href="/">Home</a></li>
      <li><a href="/services">Services &amp; Providers</a></li>
      <li><a href="/login">Customer Login</a></li>
      <li><a href="/provider/login" class="active">Provider Login</a></li>
    </ul>
    <div class="nav-right">
      <label class="theme-toggle">
        <input type="checkbox" id="darkToggle">
        <span class="toggle-track">
          <span class="icon sun">☀️</span>
          <span class="icon moon">🌙</span>
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>
  </div>
</nav>

<!-- LOGIN SECTION -->
<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card">
      
      <!-- Brand -->
      <div class="login-brand">
        <img src="/static/final_logo.png" alt="NepSewa Logo" class="login-logo">
        <h1>Provider Login</h1>
        <p>Access your provider dashboard</p>
      </div>

      <div id="msg" class="msg"></div>

      <!-- PROVIDER LOGIN FORM -->
      <div class="login-form-section active">
        <div class="login-field">
          <label>EMAIL OR PHONE</label>
          <input type="text" id="loginId" placeholder="you@example.com or 9800000000" autocomplete="username">
        </div>
        <div class="login-field">
          <label>PASSWORD</label>
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
        </div>
        <button class="login-btn" id="loginBtn" onclick="doProviderLogin()">Login to Dashboard</button>
      </div>

      <!-- Footer -->
      <div class="login-footer">
        Don't have a provider account? <a href="/register-provider">Register here</a><br>
        <a href="/">← Back to Home</a>
      </div>

    </div>
  </div>
</div>

<script src="/static/alerts.js"></script>
<script>
// Dark mode toggle
const darkToggle = document.getElementById('darkToggle');

if (localStorage.getItem('theme') === 'light') {
  document.body.classList.add('light');
  darkToggle.checked = true;
}

darkToggle.addEventListener('change', () => {
  document.body.classList.toggle('light', darkToggle.checked);
  localStorage.setItem('theme', darkToggle.checked ? 'light' : 'dark');
});

// Mobile menu toggle
function toggleMobileMenu() {
    const menu = document.getElementById('navMenu');
    const hamburger = document.getElementById('mobileMenuToggle');
    
    if (!menu || !hamburger) return;
    
    menu.classList.toggle('active');
    hamburger.classList.toggle('active');
}

document.addEventListener('DOMContentLoaded', function() {
    const hamburger = document.getElementById('mobileMenuToggle');
    
    if (hamburger) {
        hamburger.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            toggleMobileMenu();
        });
    }
    
    // Close menu when clicking outside
    document.addEventListener('click', function(event) {
        const menu = document.getElementById('navMenu');
        const hamburger = document.getElementById('mobileMenuToggle');
        
        if (menu && hamburger && menu.classList.contains('active')) {
            if (!hamburger.contains(event.target) && !menu.contains(event.target)) {
                menu.classList.remove('active');
                hamburger.classList.remove('active');
            }
        }
    });
});

async function doProviderLogin() {
    const loginId = document.getElementById('loginId').value.trim();
    const password = document.getElementById('password').value.trim();
    const submitBtn = document.getElementById('loginBtn');
    const msgEl = document.getElementById('msg');
    
    // Clear previous messages
    msgEl.textContent = '';
    msgEl.className = 'msg';
    
    if (!loginId || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
    }
    
    // Show loading state
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    
    try {
        const response = await fetch('/api/provider/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'same-origin',
            body: JSON.stringify({
                email: loginId,
                password: password
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            showMessage('Login successful! Redirecting…', 'success');
            setTimeout(() => {
                window.location.href = data.redirect_url || '/provider/dashboard';
            }, 1000);
        } else {
            showMessage(data.message || 'Login failed', 'error');
        }
        
    } catch (error) {
        showMessage('Network error. Please try again.', 'error');
    } finally {
        // Reset button state
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login to Dashboard';
    }
}

function showMessage(text, type) {
    const msgEl = document.getElementById('msg');
    msgEl.textContent = (type === 'error' ? '⚠️  ' : '✅  ') + text;
    msgEl.className = `msg ${type === 'error' ? 'error' : 'ok'}`;
    msgEl.style.display = 'block';
}

// Enter key support
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    doProviderLogin();
  }
});
</script>

</body>
</html>
