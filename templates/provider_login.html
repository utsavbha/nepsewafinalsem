<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Login - NepSewa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/login.css">
    <link rel="stylesheet" href="/static/alerts.css">
</head>
<body class="light">

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <img src="/static/final_logo.png" alt="NepSewa Logo" class="login-logo">
            <h1>Provider Login</h1>
            <p>Access your provider dashboard</p>
        </div>

        <form id="providerLoginForm" class="login-form">
            <div class="form-group">
                <input type="email" id="email" placeholder="Email Address" required>
                <div class="error-message" id="error-email"></div>
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
                <div class="error-message" id="error-password"></div>
            </div>

            <button type="submit" class="login-btn">
                <span class="btn-text">Login to Dashboard</span>
                <span class="btn-loading" style="display: none;">Logging in...</span>
            </button>
        </form>

        <div class="login-footer">
            <p>Don't have a provider account? <a href="/provider/register">Register here</a></p>
            <p><a href="/">← Back to Home</a></p>
        </div>
    </div>
</div>

<script src="/static/alerts.js"></script>
<script>
document.getElementById('providerLoginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const submitBtn = document.querySelector('.login-btn');
    const btnText = document.querySelector('.btn-text');
    const btnLoading = document.querySelector('.btn-loading');
    
    // Clear previous errors
    document.querySelectorAll('.error-message').forEach(el => {
        el.textContent = '';
        el.style.display = 'none';
    });
    
    // Validation
    let isValid = true;
    
    if (!email) {
        showError('email', 'Email is required');
        isValid = false;
    }
    
    if (!password) {
        showError('password', 'Password is required');
        isValid = false;
    }
    
    if (!isValid) return;
    
    // Show loading state
    submitBtn.disabled = true;
    btnText.style.display = 'none';
    btnLoading.style.display = 'inline';
    
    try {
        const response = await fetch('/api/provider/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            showSuccess('Login successful! Redirecting to dashboard...');
            setTimeout(() => {
                window.location.href = data.redirect_url || '/provider/dashboard';
            }, 1500);
        } else {
            showError('password', data.message || 'Login failed');
        }
        
    } catch (error) {
        showError('password', 'Network error. Please try again.');
    } finally {
        // Reset button state
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
    }
});

function showError(fieldId, message) {
    const errorEl = document.getElementById(`error-${fieldId}`);
    const inputEl = document.getElementById(fieldId);
    
    if (errorEl && inputEl) {
        errorEl.textContent = message;
        errorEl.style.display = 'block';
        inputEl.style.borderColor = '#ef4444';
    }
}

function showSuccess(message) {
    if (typeof alertSystem !== 'undefined') {
        alertSystem.success(message);
    } else {
        alert(message);
    }
}
</script>

</body>
</html>
