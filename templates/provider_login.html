<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NepSewa — Provider Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
<link rel="stylesheet" href="/static/alerts.css">
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="/" class="nav-left">
      <img src="/static/final_logo.png" alt="NepSewa Logo" class="logo-img">
    </a>
    <ul class="nav-menu">
      <li><a href="/">Home</a></li>
      <li><a href="/services">Services &amp; Providers</a></li>
      <li><a href="/login">Customer Login</a></li>
      <li><a href="/provider/login" class="active">Provider Login</a></li>
    </ul>
    <div class="nav-right">
      <label class="theme-toggle">
        <input type="checkbox" id="darkToggle">
        <span class="toggle-track">
          <span class="icon sun">☀️</span>
          <span class="icon moon">🌙</span>
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <div class="container">
    <div class="card">

      <div class="brand">
        <div class="brand-icon">🏢</div>
        <h1>Provider Login</h1>
        <p>Access your provider dashboard</p>
      </div>

      <div id="msg" class="msg"></div>

      <!-- PROVIDER LOGIN FORM -->
      <div id="providerLoginForm" class="form-section active">
        <div class="field">
          <label>Phone Number</label>
          <div class="input-wrap">
            <span class="ico">📱</span>
            <input type="tel" id="phone" placeholder="9801000001" autocomplete="tel">
          </div>
          <small style="color: #64748b; font-size: 0.8rem;">Demo: Use any provider phone (e.g., 9801000001) with any password</small>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="input-wrap">
            <span class="ico">🔑</span>
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
          </div>
        </div>
        <button class="btn" id="loginBtn" onclick="doProviderLogin()">Login to Dashboard</button>
      </div>

      <div class="foot">
        Don't have a provider account? <a href="/provider/register">Register here</a><br>
        <a href="/">← Back to Home</a>
      </div>

    </div>
  </div>
</div>

<script src="/static/alerts.js"></script>
<script>
// Dark mode toggle
const toggle = document.getElementById("darkToggle");
if (toggle) {
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
        document.body.classList.add("dark");
        toggle.checked = false;
    } else {
        document.body.classList.add("light");
        toggle.checked = true;
    }

    toggle.addEventListener("change", () => {
        if (toggle.checked) {
            document.body.classList.remove("dark");
            document.body.classList.add("light");
            localStorage.setItem("theme", "light");
        } else {
            document.body.classList.remove("light");
            document.body.classList.add("dark");
            localStorage.setItem("theme", "dark");
        }
    });
}

async function doProviderLogin() {
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value.trim();
    const submitBtn = document.getElementById('loginBtn');
    const msgEl = document.getElementById('msg');
    
    // Clear previous messages
    msgEl.textContent = '';
    msgEl.className = 'msg';
    
    // Validation
    if (!phone) {
        showMessage('Phone number is required', 'error');
        return;
    }
    
    if (!/^98\d{8}$/.test(phone)) {
        showMessage('Enter a valid Nepal number (98XXXXXXXX)', 'error');
        return;
    }
    
    if (!password) {
        showMessage('Password is required', 'error');
        return;
    }
    
    // Show loading state
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    
    try {
        const response = await fetch('/api/provider/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: phone, // Using phone as email field for compatibility
                password: password
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            showMessage('Login successful! Redirecting to dashboard...', 'success');
            setTimeout(() => {
                window.location.href = data.redirect_url || '/provider/dashboard';
            }, 1500);
        } else {
            showMessage(data.message || 'Login failed', 'error');
        }
        
    } catch (error) {
        showMessage('Network error. Please try again.', 'error');
    } finally {
        // Reset button state
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login to Dashboard';
    }
}

function showMessage(text, type) {
    const msgEl = document.getElementById('msg');
    msgEl.textContent = text;
    msgEl.className = `msg ${type}`;
}
</script>

</body>
</html>
