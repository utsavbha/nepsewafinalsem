<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NepSewa — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nepsewa.css">
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-container">
    <a href="/" class="nav-left">
      <img src="/static/final_logo.png" alt="NepSewa Logo" class="logo-img">
    </a>
    
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <ul class="nav-menu" id="navMenu">
      <li><a href="/">Home</a></li>
      <li><a href="/services">Services &amp; Providers</a></li>
      <li><a href="/login" class="active">Login</a></li>
    </ul>
    <div class="nav-right">
      <label class="theme-toggle">
        <input type="checkbox" id="darkToggle">
        <span class="toggle-track">
          <span class="icon sun">☀️</span>
          <span class="icon moon">🌙</span>
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>
  </div>
</nav>

<!-- LOGIN SECTION -->
<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card">
      
      <!-- Brand -->
      <div class="login-brand">
        <img src="/static/final_logo.png" alt="NepSewa Logo" class="login-logo">
        <h1>NepSewa</h1>
        <p>Your trusted home services platform</p>
      </div>

      <!-- Tabs -->
      <div class="login-tabs">
        <button class="login-tab active" onclick="switchTab('login')">Login</button>
        <button class="login-tab" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <div id="msg" class="msg"></div>

      <!-- LOGIN FORM -->
      <div id="loginForm" class="login-form-section active">
        <div class="login-field">
          <label>EMAIL ADDRESS</label>
          <input type="email" id="l-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="login-field">
          <label>PASSWORD</label>
          <input type="password" id="l-pass" placeholder="Your password" autocomplete="current-password">
        </div>
        <button class="login-btn" id="loginBtn" onclick="doLogin()">Login to NepSewa</button>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signupForm" class="login-form-section">
        <div class="login-field">
          <label>FULL NAME</label>
          <input type="text" id="s-name" placeholder="Aarav Sharma" autocomplete="name">
        </div>
        <div class="login-field">
          <label>EMAIL ADDRESS</label>
          <input type="email" id="s-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="login-field">
          <label>PASSWORD</label>
          <input type="password" id="s-pass" placeholder="Min. 6 characters"
                 oninput="checkStrength(this.value)" autocomplete="new-password">
          <div class="strength"><div class="strength-fill" id="strengthFill"></div></div>
        </div>
        <div class="login-field">
          <label>CONFIRM PASSWORD</label>
          <input type="password" id="s-confirm" placeholder="Repeat password" autocomplete="new-password">
        </div>
        <button class="login-btn" id="signupBtn" onclick="doSignup()">Create Account</button>
      </div>

      <!-- Footer -->
      <div class="login-footer">
        By continuing you agree to our <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a>
      </div>

    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='login.js') }}"></script>

</body>
</html>
