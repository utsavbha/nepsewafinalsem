services:
  - type: web
    name: nepsewa
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: PORT
        value: 10000
    
databases:
  - name: nepsewa-db
    databaseName: nepsewa
    user: nepsewa_user